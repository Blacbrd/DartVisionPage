<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1"/>
        <title>Download darts video</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="wrap">
            <div class="card" id="card">
                <h1>Download video</h1>
                <p id="desc">Tap the button below to download the file.</p>
                <a id="btn" class="btn" href="#" role="button" rel="noopener noreferrer">Download video</a>
                
                <small style="color: #666; display: block; margin-top: 15px; font-size: 0.9em; line-height: 1.4;">
                    <strong>Android Users:</strong> If tapping the button doesn't start the download, tap the <strong>3 dots</strong> in the top right corner and select <strong>"Open in Chrome"</strong> or <strong>"Open in Browser"</strong>.
                </small>
                
                <div id="warn" class="warning" style="display:none"></div>
            </div>
        </div>

        <script>
            // Read ?url=... from query string (expected to be the temp.sh page URL)
            const params = new URLSearchParams(window.location.search);
            const url = params.get('url');

            const btn = document.getElementById('btn');
            const warn = document.getElementById('warn');
            const desc = document.getElementById('desc');

            function isLikelyUrl(u) {
                if (!u) return false;
                try {
                    const parsed = new URL(u);
                    return parsed.protocol === 'https:' || parsed.protocol === 'http:';
                } catch (e) {
                    return false;
                }
            }

            // Submit a form via POST in the CURRENT tab. 
            // Because the server returns a file attachment, the page won't actually navigate away.
            function postToUrlInNewTab(postUrl) {
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = postUrl;
                
                // FIX: Changed from '_blank' to '_self'. 
                // This prevents Android popup blockers from killing the download.
                form.target = '_self'; 
                form.style.display = 'none';
                document.body.appendChild(form);

                try {
                    form.submit();
                } catch (e) {
                    // Ultimate fallback: navigate to the URL directly.
                    // They will see the temp.sh landing page, but they can manually click download.
                    window.location.href = postUrl;
                } finally {
                    setTimeout(() => form.remove(), 1000);
                }
            }

            if (!isLikelyUrl(url)) {
                // No valid URL provided -> show helpful instruction
                btn.style.display = 'none';
                warn.style.display = 'block';
                warn.textContent =
                    'Download link missing or invalid. Ask the sender to regenerate the QR code.';
                desc.textContent = 'No download link found.';
            } else {
                // Attach click handler to post to the temp.sh page's form endpoint
                btn.addEventListener('click', function (ev) {
                    ev.preventDefault();
                    // Safety: only allow http/https
                    if (!isLikelyUrl(url)) {
                        warn.style.display = 'block';
                        warn.textContent = 'Invalid download URL.';
                        return;
                    }
                    postToUrlInNewTab(url);
                });
            }
        </script>
    </body>
</html>
